server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: restaurant-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 Hours

# Cấu hình tài khoản ngân hàng nhận thanh toán qua VietQR (đổi bằng biến môi trường khi deploy thật)
restaurant:
  bank:
    bin: ${BANK_BIN}
    account-number: ${BANK_ACCOUNT_NUMBER}
    account-name: ${BANK_ACCOUNT_NAME}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

